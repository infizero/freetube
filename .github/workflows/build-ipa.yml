name: Build FreeTube iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve Swift packages
        run: |
          set -euo pipefail

          RESOLVED="FreeTube/FreeTube.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

          rm -f "$RESOLVED"

          xcodebuild \
            -resolvePackageDependencies \
            -project FreeTube/FreeTube.xcodeproj \
            -scheme FreeTube

          echo "===== Package.resolved ====="
          find FreeTube -name Package.resolved -print
          if [ -f "$RESOLVED" ]; then
            cat "$RESOLVED"
          else
            echo "Package.resolved was not generated at the expected path"
            exit 1
          fi

      - name: Upload resolved dependencies
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-Package-resolved
          path: FreeTube/FreeTube.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: error
          retention-days: 7

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project FreeTube/FreeTube.xcodeproj \
            -scheme FreeTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/FreeTube.app"

          if [ ! -d "$APP" ]; then
            echo "FreeTube.app not found"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -name '*.app'
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$APP" "$RUNNER_TEMP/package/Payload/FreeTube.app"

          cd "$RUNNER_TEMP/package"
          zip -qry "$GITHUB_WORKSPACE/FreeTube-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-unsigned-IPA
          path: FreeTube-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
